name: Protobuf quality
on:
  pull_request:
    paths:
      - '**/*.proto'
      - '**/buf.yaml'
      - '**/buf.work.yaml'
      - '**/buf.lock'
      - '.protobuf-quality.json'
      - '.source-code.json'
      - 'scripts/check-protobuf.py'
      - 'scripts/check-proto-json.ts'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/check-source-code.py'
      - '.agents/skills/source-code-lifecycle/references/stages.json'
      - '.github/workflows/protobuf-quality.yml'
  push:
    branches: [main, master]
    paths:
      - '**/*.proto'
      - '**/buf.yaml'
      - '**/buf.work.yaml'
      - '**/buf.lock'
      - '.protobuf-quality.json'
      - '.source-code.json'
      - 'scripts/check-protobuf.py'
      - 'scripts/check-proto-json.ts'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/check-source-code.py'
      - '.agents/skills/source-code-lifecycle/references/stages.json'
      - '.github/workflows/protobuf-quality.yml'
permissions:
  contents: read
jobs:
  protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: bufbuild/buf-action@v1
        with:
          version: '1.75.0'
          setup_only: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: python3 scripts/check-protobuf.py tools
      - run: python3 scripts/check-protobuf.py all
        env:
          PROTOBUF_AGAINST: '.git#ref=${{ github.event.pull_request.base.sha || github.event.before }}'
