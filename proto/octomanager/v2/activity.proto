syntax = "proto3";
package octomanager.v2;

option go_package = "github.com/lanej/octo-manager/gen/octomanager/v2;octomanagerv2";

enum ActivityName {
  ACTIVITY_NAME_UNSPECIFIED = 0;
  ACTIVITY_NAME_MERGE_PR = 1;
  ACTIVITY_NAME_RUN_CHECKS = 2;
  ACTIVITY_NAME_RESOLVE_CONFLICT = 3;
  ACTIVITY_NAME_SUMMARIZE_PR = 4;
  ACTIVITY_NAME_NOTIFY_AGENT = 5;
}
enum ActivityOutcome {
  ACTIVITY_OUTCOME_UNSPECIFIED = 0;
  ACTIVITY_OUTCOME_ATTEMPTED = 1;
  ACTIVITY_OUTCOME_SUCCEEDED = 2;
  ACTIVITY_OUTCOME_FAILED = 3;
  ACTIVITY_OUTCOME_UNCERTAIN = 4;
}
// ActivityActor contains caller-supplied agent metadata rather than an authenticated identity claim.
message ActivityActor {
  string harness = 1;
  string session_id = 2;
  optional string version = 3;
  optional string model = 4;
  optional string label = 5;
  optional string cwd = 6;
}
// ActivityInput reports one named operation outcome with an idempotent request identity.
message ActivityInput {
  string request_id = 1;
  string operation_id = 2;
  ActivityName name = 3;
  ActivityOutcome outcome = 4;
  ActivityActor actor = 5;
  string detail = 6;
  optional string pr_url = 7;
  optional string evidence_url = 8;
}
// ActivityReport adds coordinator sequence and ingestion time to a caller’s operation report.
message ActivityReport {
  uint64 sequence = 1;
  int64 recorded_at_ms = 2;
  ActivityInput report = 3;
}
// RecordActivityRequest supplies arguments for the following operation: Records a caller-reported operation outcome without independently verifying it.
message RecordActivityRequest {
  ActivityInput report = 1;
}
// RecordActivityResponse returns the result for the following operation: Records a caller-reported operation outcome without independently verifying it.
message RecordActivityResponse {
  ActivityReport activity = 1;
}
// ListActivityRequest supplies arguments for the following operation: Pages recorded agent activity and coordinator events.
message ListActivityRequest {
  uint64 after_sequence = 1;
  // An exclusive upper bound selects a recent page in descending sequence order.
  // Omit for forward replay; zero selects the latest page. Do not combine with after_sequence.
  optional uint64 before_sequence = 2;
  // Recent-page size, 1–200; zero keeps the default of 200. Forward replay remains fixed-size.
  uint32 limit = 3;
}
